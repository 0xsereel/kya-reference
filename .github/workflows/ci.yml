name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FOUNDRY_PROFILE: ci

jobs:
  test:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned so gas numbers in the snapshot do not move with the toolchain.
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # Fuzz and invariant entries record run statistics, not gas, so they are left out of the snapshot.
      - name: Check gas snapshot
        run: forge snapshot --check --tolerance 5 --no-match-contract "(Fuzz|Invariants)"
