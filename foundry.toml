# Dependency pins (git submodules under lib/):
#   forge-std                        v1.9.7
#   T-REX                            4.1.6
#   ONCHAINID (onchain-id/solidity)  2.1.0   (version T-REX 4.1.6 locks)
#   openzeppelin-contracts           v4.9.3  (version T-REX 4.1.6 locks; 5.x needs solc 0.8.20)
#   openzeppelin-contracts-upgradeable v4.9.3

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.17"
optimizer = true
optimizer_runs = 200
evm_version = "london"
auto_detect_solc = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@onchain-id/solidity/=lib/onchainid/",
    "@trex/=lib/trex/",
]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 64
